# nginx 反代：api.tryleadsplaza.com -> 本机 8090 网关
# 放到 /etc/nginx/sites-available/leads-gateway，软链到 sites-enabled 后 reload。
# HTTPS 由 certbot 申请（见部署文档第 2 步）；certbot 会自动补 443 段。
server {
    listen 80;
    server_name api.tryleadsplaza.com;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MCP Streamable HTTP 是长连接/事件流：关缓冲、放宽超时
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
